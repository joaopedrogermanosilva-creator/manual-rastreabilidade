<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <title>Entrar — Manual de Rastreabilidade</title>
    <link rel="stylesheet" href="/static/css/style.css?v=14">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <span class="login-brand-mark" aria-hidden="true"><i class="ph ph-crosshair"></i></span>
                <h1 id="login-title">RASTREABILIDADE</h1>
                <p>Acesso restrito às funções administrativas</p>
            </div>
            <form class="login-form" action="/login" method="POST">
                {% if erro %}
                <p class="login-error" role="alert">{{ erro }}</p>
                {% endif %}
                <label for="login-senha">
                    Senha de Administrador
                    <input id="login-senha" type="password" name="senha" autocomplete="current-password" required autofocus>
                </label>
                <button type="submit" class="btn-primary"><i class="ph ph-lock-key"></i> Entrar como Admin</button>
            </form>
        </section>
    </main>
    {% include "info_help.html" %}
    <script src="/static/js/info.js"></script>
</body>
</html>
