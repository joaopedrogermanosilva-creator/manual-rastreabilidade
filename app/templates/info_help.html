<button type="button" class="fab-btn" aria-label="Abrir ajuda" aria-haspopup="dialog" aria-controls="modal-info">
    <i class="ph ph-question" aria-hidden="true"></i>
</button>

<dialog id="modal-info" aria-labelledby="modal-info-titulo">
    <div class="info-dialog-content">
        <header class="info-dialog-header">
            <h2 id="modal-info-titulo">{{ ajuda.titulo }}</h2>
            <button type="button" class="info-dialog-close" data-info-close aria-label="Fechar ajuda" title="Fechar">
                <i class="ph ph-x" aria-hidden="true"></i>
            </button>
        </header>
        <p class="info-dialog-text">{{ ajuda.conteudo }}</p>
        <label class="info-dialog-hide-option">
            <input type="checkbox" id="esconder-ajuda">
            <span>Não mostrar novamente nas telas internas</span>
        </label>
        <div class="info-dialog-actions">
            {% if is_admin %}
            <a href="/admin/ajuda" class="btn-cancel"><i class="ph ph-pencil-simple"></i> Editar Ajuda</a>
            {% endif %}
            <button type="button" class="btn-primary" data-info-close>Entendi</button>
        </div>
    </div>
</dialog>
