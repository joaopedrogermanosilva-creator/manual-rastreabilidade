{% extends "base.html" %}
{% block title %}Nova Pasta — Manual de Rastreabilidade{% endblock %}
{% block content %}
<section class="hero">
    <a href="{% if parent_id %}/pasta/{{ parent_id }}{% else %}/{% endif %}" class="back-link"><i class="ph ph-arrow-left"></i> Voltar</a>
    <h1>Nova Pasta<span class="accent">.</span></h1>
</section>
{% if erro %}
<p class="folder-alert" role="alert">{{ erro }}</p>
{% endif %}
<form action="/pastas/nova" method="POST" class="form-manual">
    <div class="form-group">
        <label for="nome-pasta">Nome da Pasta</label>
        <input id="nome-pasta" type="text" name="nome" required maxlength="120" value="{{ nome or '' }}">
    </div>
    <div class="form-group">
        <label for="descricao-pasta">Descrição</label>
        <textarea id="descricao-pasta" name="descricao" rows="3">{{ descricao or '' }}</textarea>
    </div>
    <div class="form-group">
        <label for="parent-id">Pasta Superior</label>
        <select id="parent-id" name="parent_id">
            <option value="">Raiz (sem pasta superior)</option>
            {% for pasta_opcao in pastas %}
            <option value="{{ pasta_opcao.id }}" {% if parent_id|string == pasta_opcao.id|string %}selected{% endif %}>{{ pasta_opcao.caminho }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-actions">
        <a href="{% if parent_id %}/pasta/{{ parent_id }}{% else %}/{% endif %}" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary"><i class="ph ph-folder-plus"></i> Criar Pasta</button>
    </div>
</form>
{% endblock %}
