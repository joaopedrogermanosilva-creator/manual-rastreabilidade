{% extends "base.html" %}
{% block title %}Nova Pasta — Manual de Rastreabilidade{% endblock %}
{% block content %}
<section class="hero">
    <a href="/" class="back-link"><i class="ph ph-arrow-left"></i> Voltar à página inicial</a>
    <h1>Nova Pasta<span class="accent">.</span></h1>
</section>
{% if erro %}
<p class="folder-alert" role="alert">{{ erro }}</p>
{% endif %}
<form action="/pastas/nova" method="POST" class="form-manual">
    <div class="form-group">
        <label for="nome-pasta">Nome da Pasta</label>
        <input id="nome-pasta" type="text" name="nome" required maxlength="120" value="{{ nome or '' }}">
    </div>
    <div class="form-group">
        <label for="descricao-pasta">Descrição</label>
        <textarea id="descricao-pasta" name="descricao" rows="3">{{ descricao or '' }}</textarea>
    </div>
    <div class="form-actions">
        <a href="/" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary"><i class="ph ph-folder-plus"></i> Criar Pasta</button>
    </div>
</form>
{% endblock %}
